name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply the patch series to the pinned upstream commit
        run: ./apply.sh "$RUNNER_TEMP/lite-kit"
      - name: Byte-compile the patched server
        run: python3 -m py_compile "$RUNNER_TEMP/lite-kit/scripts/equasar_server.py"
      - name: The patch also applies to upstream main
        run: ./apply.sh "$RUNNER_TEMP/lite-kit-main" origin/main
